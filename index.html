<style>
:root{
  --bg:#f4f6fb; --ink:#131a2e; --ink2:#4a5570; --ink3:#8792ad;
  --line:#e3e7f2; --card:#ffffff;
  --blue:#3b6ef0; --gold:#e0a020; --red:#e0453a;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,70,.05), 0 8px 24px -12px rgba(20,30,70,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#eef7f2 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0c2b22 0%,#14543f 45%,#1f8a5f 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 320px at 12% -10%,rgba(120,255,190,.28),transparent 60%),
  radial-gradient(600px 300px at 88% 0%,rgba(255,214,120,.18),transparent 60%)}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:78ch;color:rgba(255,255,255,.76);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}
.toolbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);box-shadow:0 6px 18px -16px rgba(20,30,70,.5)}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,240,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none}
.tgl:hover{border-color:#c9d2ea}
.tgl.on{background:linear-gradient(180deg,#1f9e6a,#137a4e);border-color:#137a4e;color:#fff;font-weight:600}
.tgl.gold.on{background:linear-gradient(180deg,#e8a92c,#cf8f0f);border-color:#cf8f0f;color:#3a2600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
main{padding:20px 0 70px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd8ee}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .stripe{height:3px;background:var(--hc,#94a3b8)}
.thumb{position:relative;aspect-ratio:5/4;display:flex;align-items:flex-end;justify-content:center;gap:4%;
  background:radial-gradient(circle at 50% 30%,#e8f6ee,#d7ecdf);border-bottom:1px solid #e4f0e9;
  overflow:hidden;padding:10px 8px 0}
.thumb img{object-fit:contain;transition:transform .18s ease}
.thumb img.k{height:88%}
.thumb img.p{height:64%}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .one{height:86%;display:flex;align-items:flex-end;justify-content:center}
.thumb .one img{height:100%}
.badge{position:absolute;top:7px;right:7px;z-index:2;font-size:10.5px;font-weight:700;
  padding:2.5px 7px;border-radius:999px;background:#e8f4ec;color:#1a7a4a;border:1px solid #bfe3cd}
.badge.shop{background:#e8efff;color:#25459e;border-color:#c3d4f5}
.badge.hide{background:#f2f3f7;color:#8792ad;border-color:#dfe3ee}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef7f2;color:#1f6e4e;font-weight:600;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(15,21,44,.55);backdrop-filter:blur(4px)}
.lb-panel{position:relative;background:#fff;border-radius:18px;width:min(880px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(10,16,40,.55);display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr)}
@media(max-width:760px){.lb-panel{grid-template-columns:1fr}}
.lb-vis{background:radial-gradient(circle at 50% 36%,#f2faf5,#e2efe7);display:flex;align-items:flex-end;justify-content:center;
  gap:5%;padding:26px 20px;border-right:1px solid var(--line)}
.lb-vis img.k{max-height:min(44vh,320px);max-width:56%;object-fit:contain}
.lb-vis img.p{max-height:min(32vh,230px);max-width:38%;object-fit:contain}
.lb-vis .none{color:#adb6cc;text-align:center}
.lb-info{padding:22px 24px 26px;min-width:0}
.lb-info h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:16px}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f1f4fb;color:var(--ink2);font-weight:600}
.tg.g{background:#e8f4ec;color:#1a7a4a}
.tg.b{background:#e8efff;color:#25459e}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
dt{color:var(--ink3);white-space:nowrap}
dd{margin:0;color:var(--ink);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.lb-nav{position:absolute;top:12px;right:14px;display:flex;gap:6px}
.lb-nav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;

.lb-nav button:hover{background:#f4f6fb;border-color:#c9d2ea}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:22px 0 40px}
footer code{background:#eef1f8;padding:1.5px 5px;border-radius:5px;font-size:12px;color:var(--ink2)}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}

rue,"shop":false,"hid":false,"k":"TowerSkin1061_king.png","p":"TowerSkin1061_princess.png","ke":"","pe":""},{"n":"TowerSkin87","t":"Season 86 · viking","s":86,"id":"87","sc":"towerskin_season_86_viking.sc","col":true,"shop":false,"hid":false,"k":"TowerSkin87_king.png","p":"TowerSkin87_princess.png","ke":"","pe":""},{"n":"TowerSkin88","t":"Season 87 · miniongiant","s":87,"id":"88","sc":"towerskin_season_87_miniongiant.sc","col":true,"shop":false,"hid":false,"k":"TowerSkin88_king.png","p":"TowerSkin88_princess.png","ke":"","pe":""},{"n":"TowerSkin1062","t":"Season 87 · minionacademy","s":87,"id":"1062","sc":"towerskin_season_87_minionacademy.sc","col":true,"shop":false,"hid":false,"k":"TowerSkin1062_king.png","p":"TowerSkin1062_princess.png","ke":"","pe":""}]};
const K = META.skins;
const IMG = META.css;

const TOWER = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 21V9l2-2V4h2v2h4V4h2v3l2 2v12M10 21v-4a2 2 0 0 1 4 0v4"/></svg>';

(function(){
  const col = K.filter(x=>x.col).length;
  const shop = K.filter(x=>x.shop).length;
  const seas = new Set(K.filter(x=>x.s).map(x=>x.s));
  const both = K.filter(x=>x.k&&x.p).length;
  document.getElementById('lead').textContent =
    ``;
  const S=[[K.length,"皮肤总数"],[both,"双塔图齐全"],[col,"可收集"],[seas.size,"涉及赛季"],[shop,"可上架商店"]];
  document.getElementById('stats').innerHTML = S.map(([v,l],i)=>
    `<div class="stat${i===1?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const drop = META.droppedCount | 0;
  if(drop) document.getElementById('f-drop').textContent =
    `另有 ${drop} 套因素材缺失未能渲染（${META.dropped.slice(0,4).map(esc).join("、")}${drop>4?" 等":""}）未列入本页。`;
})();

const seaCount={};
K.forEach(x=>{ if(x.s) seaCount[x.s]=(seaCount[x.s]||0)+1; });
document.getElementById('sea').innerHTML = '<option value="">全部赛季</option>' +
  Object.keys(seaCount).sort((a,b)=>a-b).map(s=>`<option value="${s}">Season ${s} (${seaCount[s]})</option>`).join('');

const S = {q:"", sea:"", sort:"idx", col:false, shop:false, hid:false};
function match(x){
  if(S.sea && String(x.s||"")!==S.sea) return false;
  if(S.col && !x.col) return false;
  if(S.shop && !x.shop) return false;
  if(!S.hid && x.hid) return false;
  if(S.q){
    const hay=(x.t+" "+x.n+" "+x.sc+" "+(x.s?"season "+x.s:"")+" "+x.id).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function sortList(a,b){
  if(S.sort==="name") return (a.t||a.n).localeCompare(b.t||b.n);
  if(S.sort==="season") return (a.s||99)-(b.s||99) || String(a.id).localeCompare(String(b.id));
  return idx(a)-idx(b);
}
const IDX = new Map(K.map((x,i)=>[x,i]));
function idx(x){ return IDX.get(x); }

const grid=document.getElementById('grid'), countEl=document.getElementById('count'), emptyEl=document.getElementById('empty');
let VIEW=[];
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function duo(x){
  if(x.k&&x.p) return `<img class="k" loading="lazy" decoding="async" src="${IMG}${x.k}" alt="${esc(x.t)} 国王塔"><img class="p" loading="lazy" decoding="async" src="${IMG}${x.p}" alt="公主塔">`;
  const src=x.k||x.p;
  return `<div class="one"><img loading="lazy" decoding="async" src="${IMG}${src}" alt="${esc(x.t)}"></div>`;
}
function card(x){
  const badges =
    (x.col?`<div class="badge" title="Collectable">可收集</div>`:"")+
    (x.shop?`<div class="badge shop" title="AvailableForShopOffer">可上架</div>`:"")+
    (x.hid?`<div class="badge hide" title="HiddenFromClient">隐藏</div>`:"");
  return `<article class="card" tabindex="0" data-n="${esc(x.n)}">
    <div class="stripe" style="--hc:${x.s?'#1f9e6a':'#8792ad'}"></div>
    <div class="thumb">${badges}${duo(x)}</div>
    <div class="cbody">
      <div class="cname">${esc(x.t||x.n)}</div>
      <div class="cmeta">
        ${x.s?`<span class="fam">Season ${x.s}</span>`:`<span class="fam" style="background:#f1f4fb;color:#4a5570">基础</span>`}
        <span class="yr">Id ${esc(x.id)}</span>
      </div>
    </div>
  </article>`;
}
function render(){
  VIEW=K.filter(match).sort(sortList);
  countEl.innerHTML=`显示 <b>${VIEW.length}</b> / ${K.length} 套塔皮肤`;
  emptyEl.style.display=VIEW.length?"none":"block";
  grid.innerHTML=VIEW.map(card).join('');
}
grid.addEventListener('click',ev=>{
  const c=ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(x=>x.n===c.dataset.n));
});
grid.addEventListener('keydown',ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  const c=ev.target.closest('.card'); if(!c) return;
  ev.preventDefault(); openBy(VIEW.findIndex(x=>x.n===c.dataset.n));
});

const lb=document.getElementById('lb');
let cur=-1;
function openBy(i){
  if(i<0||i>=VIEW.length) return;
  cur=i; const x=VIEW[i];
  document.getElementById('lb-vis').innerHTML = (x.k||x.p)
    ? `${x.k?`<img class="k" src="${IMG}${x.k}" alt="国王塔">`:""}${x.p?`<img class="p" src="${IMG}${x.p}" alt="公主塔">`:""}`
    : `<div class="none">${TOWER}<div style="margin-top:8px">素材未收录</div></div>`;
  const tgs=[];
  if(x.col) tgs.push('<span class="tg g">可收集</span>');
  if(x.shop) tgs.push('<span class="tg b">可上架商店</span>');
  if(x.hid) tgs.push('<span class="tg">对客户端隐藏</span>');
  if(x.s) tgs.push(`<span class="tg">Season ${x.s}</span>`);
  document.getElementById('lb-info').innerHTML=`
    <h2>${esc(x.t||x.n)}</h2>
    <div class="lb-sub">${x.s?"Season "+x.s+" · ":""}数据名 ${esc(x.n)}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <dl>
      <dt>皮肤 Id</dt><dd>${esc(x.id)}</dd>
      <dt>精灵文件</dt><dd>${esc(x.sc)}</dd>
      <dt>国王塔导出</dt><dd>${esc(x.ke||"—")}</dd>
      <dt>公主塔导出</dt><dd>${esc(x.pe||"—")}</dd>
    </dl>
    ${(!x.k||!x.p)?`<div class="lb-tags" style="margin-top:14px"><span class="tg" style="background:#fff8e6;color:#7a5a10">该精灵内未找到${!x.k?"国王塔":""}${(!x.k&&!x.p)?"、":""}${!x.p?"公主塔":""}导出，图省略</span></div>`:""}
  `;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }
lb.addEventListener('click',ev=>{ if(ev.target.hasAttribute('data-close')) close(); });
document.getElementById('prev').onclick=()=>openBy(cur-1);
document.getElementById('next').onclick=()=>openBy(cur+1);
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('open')) return;
  if(ev.key==="Escape") close();
  if(ev.key==="ArrowLeft") openBy(cur-1);
  if(ev.key==="ArrowRight") openBy(cur+1);
});

let timer;
document.getElementById('q').addEventListener('input',ev=>{
  clearTimeout(timer); const v=ev.target.value;
  timer=setTimeout(()=>{S.q=v.trim(); render();},120);
});
document.getElementById('sea').onchange=ev=>{S.sea=ev.target.value; render();};
document.getElementById('sort').onchange=ev=>{S.sort=ev.target.value; render();};
function tgl(id,key){
  const el=document.getElementById(id);
  el.onclick=()=>{S[key]=!S[key]; el.classList.toggle('on',S[key]); render();};
}
tgl('t-col','col'); tgl('t-shop','shop'); tgl('t-hid','hid');
document.getElementById('reset').onclick=()=>{
  S.q="";S.sea="";S.sort="idx";S.col=false;S.shop=false;S.hid=false;
  document.getElementById('q').value="";document.getElementById('sea').value="";document.getElementById('sort').value="idx";
  document.querySelectorAll('.tgl.on').forEach(el=>el.classList.remove('on'));
  render();
};
render();
</script>
